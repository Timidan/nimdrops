# TLS edge overlay. Kept separate from docker-compose.yml because compose
# interpolates every service on every invocation: a required PUBLIC_HOSTNAME in
# the base file makes `docker compose run`, `logs` and `ps` fail on a host that
# has no DNS name yet (learned the hard way on the deployment).
#
# Going live:
#   1. point an A/AAAA record at this host
#   2. in .env set PUBLIC_HOSTNAME=<name> and PUBLIC_ORIGIN=https://<same name>
#   3. docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d
#
# Ports 80 and 443 must be reachable from the internet or the ACME challenge
# cannot complete. PUBLIC_ORIGIN must match the certificate name: it is baked
# into every share link and into the signed claim challenge, so a mismatch
# invalidates challenges and produces links nobody can open.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - server
    networks:
      - default
      - public_proxy
    environment:
      # Caddy substitutes this into the site block in ./Caddyfile. Required here
      # rather than defaulted: a placeholder name would burn ACME rate limits on
      # a domain nobody controls.
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:?set PUBLIC_HOSTNAME to the public DNS name, e.g. drops.example.com}
      # The two halves of client-IP resolution (./Caddyfile). Both optional and
      # both only useful together with the matching value on the `server`
      # service; every way of getting them wrong ends in ONE shared rate-limit
      # bucket, never in a client choosing its own.
      #
      #  - CLOUDFLARE_PROXY_CIDRS: space-separated v4 AND v6 ranges from
      #    https://www.cloudflare.com/ips/. STATIC — Caddy does not refresh it,
      #    so re-read that page at deploy time. Left blank here it reaches Caddy
      #    as an empty string, which trusts NO peer (verified with `caddy
      #    adapt`: `trusted_proxies` comes out with no ranges) — the same
      #    fail-safe as the Caddyfile's TEST-NET-1 fallback, by a different
      #    route, since Caddy only applies that default when the variable is
      #    absent rather than empty.
      #  - CADDY_APP_SHARED_SECRET: must equal the value the `server` service
      #    gets. `openssl rand -hex 32`.
      CLOUDFLARE_PROXY_CIDRS: ${CLOUDFLARE_PROXY_CIDRS:-}
      CADDY_APP_SHARED_SECRET: ${CADDY_APP_SHARED_SECRET:-}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Host-managed Origin CA material is intentionally outside the repo and
      # mounted read-only. Only the Findling site block references these files;
      # the other sites continue using Caddy's automatic certificate storage.
      - type: bind
        source: ${CADDY_ORIGIN_CERT_DIR:-/home/agentops/.config/nimdrops-caddy/tls}
        target: /etc/caddy/origin-certs
        read_only: true
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:

networks:
  public_proxy:
    external: true
