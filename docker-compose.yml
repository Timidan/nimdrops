# NimDrops deployment: Postgres, one API process, ONE worker, and Caddy.
#
# The single worker is a correctness constraint, not a resource decision: it
# holds `pg_advisory_lock(42)` and is the only process that signs or broadcasts.
# Never scale it — `docker compose up --scale worker=2` is a bug, not a knob.
#
# Schema migrations are NOT run automatically: a financial schema change should
# be a deliberate operator action, taken before the new image starts serving.
#   docker compose run --rm --entrypoint sh server -c "cd /app/server && pnpm tsx src/db/migrate-cli.ts"

x-app: &app
  build:
    context: .
    dockerfile: server/Dockerfile
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  environment:
    # Every Global Constraints variable, passed through from the operator's .env.
    #
    # CUSTODY_PRIVATE_KEY_HEX IS NOT HERE. It is set on the `worker` service and
    # nowhere else: the worker holds advisory lock 42 and is the only process
    # that signs or broadcasts, so it is the only process that needs the key.
    # The API needs the custody ADDRESS — funding instructions, `/health`, the
    # solvency read — and used to be handed the key purely so `NimiqChain` could
    # derive that address from it, which put the hot wallet in the environment of
    # the one container that faces the internet in exchange for a string.
    # `readOnlyNimiqChainFromEnv` takes CUSTODY_ADDRESS instead, and every
    # signing path on the resulting client throws (design §10.3).
    DATABASE_URL: postgres://nimdrops:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/nimdrops
    CUSTODY_ADDRESS: ${CUSTODY_ADDRESS:?set CUSTODY_ADDRESS in .env}
    STATUS_TOKEN_SECRET: ${STATUS_TOKEN_SECRET:?set STATUS_TOKEN_SECRET in .env}
    ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    NIMIQ_NETWORK: ${NIMIQ_NETWORK:?set NIMIQ_NETWORK in .env}
    PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN in .env}
    SIG_SCHEME: ${SIG_SCHEME:-nimiq-signed-message}
    # Proves to the API that an X-NimDrops-Client-IP header came from our own
    # Caddy and not from someone who found the origin. OPTIONAL and unset by
    # default: with no proxy the API buckets by socket peer, which is right. Set
    # it here and in the caddy service (docker-compose.tls.yml) TOGETHER — Caddy
    # sending a secret the API does not know, or the reverse, degrades to one
    # shared rate-limit bucket for every claimant.
    CADDY_APP_SHARED_SECRET: ${CADDY_APP_SHARED_SECRET:-}

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: nimdrops
      POSTGRES_USER: nimdrops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      # LOOPBACK ONLY. `5432:5432` binds 0.0.0.0 and publishes the custody
      # database to the internet — docker-proxy also punches straight past a
      # host firewall, so ufw would not have saved us. The app talks to
      # `postgres:5432` over the compose network and never needs this mapping;
      # it exists so an operator on the box can run psql. Anything remote goes
      # through an SSH tunnel.
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nimdrops -d nimdrops"]
      interval: 5s
      timeout: 5s
      retries: 20

  # HTTP only: API, SSR campaign pages, SPA assets. Signs nothing.
  server:
    <<: *app
    command: ["pnpm", "exec", "tsx", "src/index.ts"]
    expose:
      - "8080"
    healthcheck:
      # `/health` stays 503 until the worker has reconciled, which is the
      # intended reading: an unreconciled system must not be advertised ready.
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 60s

  # The single writer to the chain. Exactly one replica, always.
  #
  # The ONLY service with the custody key, and therefore also the service to run
  # the operator CLI through — `recover.ts float set|resume|replace|deposits`
  # all build a signing client and will refuse to start under `server`:
  #   docker compose run --rm --entrypoint sh worker -c \
  #     "cd /app/server && pnpm tsx src/recover.ts status"
  worker:
    <<: *app
    command: ["pnpm", "exec", "tsx", "src/worker.ts"]
    # A full block, not an addition: a YAML merge key is replaced wholesale by a
    # sibling of the same name, never deep-merged. CUSTODY_ADDRESS is
    # deliberately ABSENT — the worker derives the address from the key it
    # holds, and a second, separately-configured source for the same value is a
    # way for the two to disagree, not a safety net.
    environment:
      DATABASE_URL: postgres://nimdrops:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/nimdrops
      CUSTODY_PRIVATE_KEY_HEX: ${CUSTODY_PRIVATE_KEY_HEX:?set CUSTODY_PRIVATE_KEY_HEX in .env}
      STATUS_TOKEN_SECRET: ${STATUS_TOKEN_SECRET:?set STATUS_TOKEN_SECRET in .env}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      NIMIQ_NETWORK: ${NIMIQ_NETWORK:?set NIMIQ_NETWORK in .env}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN in .env}
      SIG_SCHEME: ${SIG_SCHEME:-nimiq-signed-message}
    deploy:
      replicas: 1

# The TLS edge lives in docker-compose.tls.yml, deliberately NOT here: compose
# interpolates every service on every invocation, so a required PUBLIC_HOSTNAME
# in this file would break `docker compose run migrate`, `logs`, `ps` and every
# other command on a host that has no DNS name yet.
#
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d

volumes:
  pgdata:
