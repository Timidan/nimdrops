<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="NimDrops">
  <!-- A tile, not a bare glyph: the mark has to hold against both light and dark
       browser chrome, and only an opaque ink field does that in both. -->
  <rect width="32" height="32" rx="7" fill="#1F2348"/>
  <!-- Filled silhouette rather than a stroked outline. At 16px a 1px stroke
       greys out into the tile; the solid body is what survives. -->
  <rect x="5" y="9.5" width="22" height="15" rx="2.5" fill="#E9B213"/>
  <path d="M6.6 11.2 16 19 25.4 11.2" fill="none" stroke="#1F2348" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Wax seal at the crease. The ink ring is what separates it from the body;
       gold on gold would read as one shape once the icon is scaled down. -->
  <circle cx="16" cy="19" r="5.1" fill="#1F2348"/>
  <circle cx="16" cy="19" r="3.4" fill="#E9B213"/>
</svg>
